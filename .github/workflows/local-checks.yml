name: Local PostgreSQL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_PYTHON: '3.12.14'
  UV_NO_PROGRESS: '1'
  UV_DEFAULT_INDEX: https://pypi.org/simple
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  source:
    name: Source / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_EVIDENCE_NAME: cryptalis-source-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          python-version: '3.12.14'
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install PostgreSQL 16 tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Install locked source dependencies
        run: uv sync --locked --all-extras
      - name: Measure column-lineage inspection
        env:
          BASELINE_REVISION: ${{ github.event.pull_request.base.sha || format('refs/remotes/origin/{0}', github.event.repository.default_branch) }}
        run: |
          mkdir -p "$RUNNER_TEMP/$CI_EVIDENCE_NAME"
          .venv/bin/python scripts/benchmark_admission.py --baseline "$BASELINE_REVISION" --output "$RUNNER_TEMP/$CI_EVIDENCE_NAME/admission.json"
      - name: Run complete default suite on an isolated cluster
        run: >-
          .venv/bin/python scripts/ci_qualification.py source
          --workdir "$RUNNER_TEMP/cryptalis-source-private"
          --evidence "$RUNNER_TEMP/$CI_EVIDENCE_NAME/qualification"
      - name: Audit the frozen dependency lock
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/$CI_EVIDENCE_NAME"
          uv audit --frozen --output-format json > "$RUNNER_TEMP/$CI_EVIDENCE_NAME/dependency-audit.json"
      - name: Retain public PostgreSQL installer packages
        run: |
          mkdir "$RUNNER_TEMP/$CI_EVIDENCE_NAME/postgres-packages"
          dpkg-query -W postgresql-16 postgresql-client-16 libpq5 > "$RUNNER_TEMP/$CI_EVIDENCE_NAME/postgres-packages/installed-versions.txt"
          cd "$RUNNER_TEMP/$CI_EVIDENCE_NAME/postgres-packages"
          # Retain Ubuntu packages separately from the observed runner versions.
          apt-get download postgresql-16/noble-updates postgresql-client-16/noble-updates libpq5/noble-updates
          sha256sum ./*.deb > SHA256SUMS
      - name: Record job outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/$CI_EVIDENCE_NAME"
          printf '{"job_status":"%s","production_gates":"UNKNOWN"}\n' "$CI_JOB_STATUS" > "$RUNNER_TEMP/$CI_EVIDENCE_NAME/job-status.json"
      - name: Retain explicit source receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  release:
    name: Reproducible artifacts / installed recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI_EVIDENCE_NAME: cryptalis-release-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          python-version: '3.12.14'
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install PostgreSQL 16 tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Install locked source dependencies
        run: uv sync --locked --all-extras
      - name: Inspect reproducible artifacts and run installed fresh recovery
        run: >-
          .venv/bin/python scripts/ci_qualification.py release
          --workdir "$RUNNER_TEMP/cryptalis-release-private"
          --evidence "$RUNNER_TEMP/$CI_EVIDENCE_NAME"
      - name: Record job outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/$CI_EVIDENCE_NAME"
          printf '{"job_status":"%s","production_gates":"UNKNOWN"}\n' "$CI_JOB_STATUS" > "$RUNNER_TEMP/$CI_EVIDENCE_NAME/job-status.json"
      - name: Retain inspected artifacts and explicit receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.CI_EVIDENCE_NAME }}/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
