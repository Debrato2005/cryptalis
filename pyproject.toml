[project]
name = "cryptalis"
version = "0.1.0"
description = "Manifest-first searchable encryption for PostgreSQL applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "greenlet==3.5.6",
    "SQLAlchemy==2.1.3",
    "psycopg[binary]==3.3.6",
]

[project.scripts]
cryptalis = "cryptalis.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "packaging>=26.3",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
