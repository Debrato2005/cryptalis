[project]
name = "cryptalis"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "SQLAlchemy==2.1.3",
    "psycopg[binary]==3.3.6",
]

[project.scripts]
cryptalis = "cryptalis.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
