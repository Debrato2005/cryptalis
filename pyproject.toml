[project]
name = "cryptalis"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cryptalis = "cryptalis.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
