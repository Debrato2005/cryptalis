[project]
name = "cryptalis-http-qualification"
version = "0.1.0"
description = "Locked dependencies for unchanged original HTTP application qualification"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.20.1",
    "anyio==4.15.1",
    "cryptalis",
    "email-validator==2.3.0",
    "emails==0.6",
    # Upstream's FastAPI standard extra conflicts with its sentry-sdk<2 pin on
    # current FastAPI. Keep runtime imports, and pin uvicorn's standard extras.
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "PyJWT[crypto]==2.15.1",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "python-multipart==0.0.32",
    "pytest==9.1.1",
    "sentry-sdk[fastapi]==1.45.1",
    "SQLAlchemy==2.1.3",
    "sqlmodel==0.0.48",
    "starlette==1.10.0",
    "tenacity==8.5.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
cryptalis = { path = "../..", editable = true }

[tool.uv]
package = false
